<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a3324" />
    <title>Solitaire</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a3324'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20' fill='%23d4b46a'%3E%E2%99%A0%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <p class="kicker" id="game-kicker">Solitaire</p>
          <div class="brand-row">
            <h1>Solitaire</h1>
            <button type="button" class="btn home-btn" id="btn-home" data-testid="btn-home">Games</button>
          </div>
        </div>
        <dl class="meters">
          <div>
            <dt>Time</dt>
            <dd id="meter-time">0:00</dd>
          </div>
          <div>
            <dt>Moves</dt>
            <dd id="meter-moves">0</dd>
          </div>
          <div id="meter-score-wrap">
            <dt>Score</dt>
            <dd id="meter-score">0</dd>
          </div>
        </dl>
        <div class="toolbar" id="toolbar" role="toolbar" aria-label="Game controls"></div>
      </header>
      <main class="table" id="table"></main>
      <footer class="status">
        <span id="status-text">Deal a card from the stock, or move a face-up card.</span>
        <span id="status-seed"></span>
      </footer>
    </div>
    <div id="drag-layer" aria-hidden="true"></div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
