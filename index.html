<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a3324" />
    <title>Solitaire</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a3324'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20' fill='%23d4b46a'%3E%E2%99%A0%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <p class="kicker">Klondike</p>
          <h1>Solitaire</h1>
        </div>
        <dl class="meters">
          <div>
            <dt>Time</dt>
            <dd id="meter-time">0:00</dd>
          </div>
          <div>
            <dt>Moves</dt>
            <dd id="meter-moves">0</dd>
          </div>
          <div>
            <dt>Score</dt>
            <dd id="meter-score">0</dd>
          </div>
        </dl>
        <div class="toolbar" role="toolbar" aria-label="Game controls">
          <div class="segmented" role="group" aria-label="Draw mode">
            <button type="button" id="btn-draw-1" data-draw="1">Draw 1</button>
            <button type="button" id="btn-draw-3" data-draw="3">Draw 3</button>
          </div>
          <button type="button" class="btn" id="btn-new" title="New game (N)">New</button>
          <button type="button" class="btn" id="btn-undo" title="Undo (U)">Undo</button>
          <button type="button" class="btn" id="btn-hint" title="Hint (H)">Hint</button>
          <button type="button" class="btn" id="btn-finish" hidden title="Send remaining cards to foundations (A)">Finish</button>
          <button type="button" class="icon-btn" id="btn-mute" aria-label="Mute"></button>
          <button type="button" class="icon-btn" id="btn-help" aria-label="Help">?</button>
        </div>
      </header>
      <main class="table" id="table"></main>
      <footer class="status">
        <span id="status-text">Deal a card from the stock, or move a face-up card.</span>
        <span id="status-seed"></span>
      </footer>
    </div>
    <div id="drag-layer" aria-hidden="true"></div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
