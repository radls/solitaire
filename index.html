<!DOCTYPE html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080c0b" />
    <script>
      (function () {
        var theme = "night";
        try {
          var raw = localStorage.getItem("grok-solitaire:prefs");
          if (raw) {
            var prefs = JSON.parse(raw);
            if (prefs.theme === "classic") theme = "classic";
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "classic" ? "#0a3324" : "#080c0b");
      })();
    </script>
    <title>Solitaire</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a3324'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='20' fill='%23d4b46a'%3E%E2%99%A0%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <p class="kicker" id="game-kicker">Solitaire</p>
          <div class="brand-row">
            <h1>Solitaire</h1>
            <button type="button" class="btn home-btn" id="btn-home" data-testid="btn-home">Games</button>
            <button type="button" class="icon-btn theme-btn" id="btn-theme" data-testid="btn-theme" aria-label="Switch to classic theme">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M14.6 2.6a8.2 8.2 0 1 0 6.8 12.2A7 7 0 0 1 14.6 2.6z"/></svg>
            </button>
          </div>
        </div>
        <dl class="meters" id="meters" hidden>
          <div>
            <dt>Time</dt>
            <dd id="meter-time">0:00</dd>
          </div>
          <div>
            <dt>Moves</dt>
            <dd id="meter-moves">0</dd>
          </div>
          <div id="meter-score-wrap">
            <dt>Score</dt>
            <dd id="meter-score">0</dd>
          </div>
        </dl>
        <div class="toolbar" id="toolbar" role="toolbar" aria-label="Game controls"></div>
      </header>
      <main class="table" id="table"></main>
      <footer class="status">
        <span id="status-text">Deal a card from the stock, or move a face-up card.</span>
        <span id="status-seed"></span>
      </footer>
      <nav class="thumb-bar" id="thumb-bar" data-testid="thumb-bar" aria-label="Play">
        <button type="button" class="btn" id="thumb-undo" data-testid="thumb-undo" disabled>Undo</button>
        <button type="button" class="btn" id="thumb-hint" data-testid="thumb-hint">Hint</button>
        <button type="button" class="btn" id="thumb-new" data-testid="thumb-new">New</button>
      </nav>
    </div>
    <div id="drag-layer" aria-hidden="true"></div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
